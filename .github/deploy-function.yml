# NOTE: GitHub blocks Claude's app token from touching files under
# .github/workflows/, so this UPDATED copy lives one level up while the
# previous version keeps running. Activate it with:
#   git mv -f .github/deploy-function.yml .github/workflows/deploy-function.yml
#
# What changed: the existence check no longer swallows errors. The old
# `describe >/dev/null 2>&1` treated EVERY failure - permission denied, a
# wrong project id, an API outage - as "never deployed" and skipped the
# function with a green tick. That is how every deploy run to date shipped
# nothing: all four functions were "skipped: never deployed" while they were
# live and serving. Now only a genuine NOT_FOUND skips; any other describe
# failure prints gcloud's actual error and fails the job.
#
# Redeploys the Cloud Functions on pushes to main that touch the code the
# bundle is built from, or on demand from the Actions tab. Four functions
# share the one bundle (functions/dist), each with its own entry point:
# leader-outreach (the cron), leader-import-lead and leader-bulk-import
# (the bulk import fan-out), and leader-westringia (the public API behind
# westringia.com's contact page).
#
# Env vars and secrets are deliberately NOT passed to `gcloud functions deploy`:
# a deploy that omits --set-env-vars / --set-secrets keeps whatever the function
# already has, so a CI redeploy can never flip AUTOMATION_ENABLED back to false
# or detach a secret. For the same reason a function that has never been
# deployed is skipped here rather than created half-configured - the first
# deploy (which sets all of that up) stays the manual one documented in
# README.md.
#
# Required repository secrets:
#   GCP_PROJECT_ID  the Google Cloud project id
#   GCP_SA_KEY      JSON key for a deployer service account (see README.md)

name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      # functions/src/index.ts bundles code out of these places
      - functions/**
      - packages/core/src/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-function.yml
  workflow_dispatch:

# One deploy at a time; a queued push waits rather than racing the current one.
concurrency:
  group: deploy-leader-functions
  cancel-in-progress: false

env:
  REGION: australia-southeast1
  RUNTIME: nodejs22

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle the functions
        run: pnpm run build:functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          # redeploy <name> <entry-point> <timeout> <memory> [extra flags...]
          # Auth flags are left to the first manual deploy on purpose: a
          # redeploy that names none keeps the function's existing invoker
          # policy, and changing it needs IAM rights the deployer lacks.
          redeploy() {
            local name="$1" entry="$2" timeout="$3" memory="$4"
            # Capture describe's stderr (stdout is noise): only a genuine
            # NOT_FOUND means "never deployed". Anything else - permission
            # denied above all - must fail the run, because skipping on it
            # is how a broken deployer stays green while shipping nothing.
            local err
            if ! err=$(gcloud functions describe "$name" \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --gen2 --region="$REGION" 2>&1 >/dev/null); then
              if grep -qiE 'NOT_FOUND|was not found|does not exist' <<<"$err"; then
                echo "Skipping $name: never deployed (the first deploy is manual, see README.md)"
                return 0
              fi
              echo "::error::Could not check whether $name exists, so it was NOT redeployed. gcloud said:"
              echo "$err"
              return 1
            fi
            gcloud functions deploy "$name" \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --gen2 --runtime="$RUNTIME" --region="$REGION" \
              --source=functions --entry-point="$entry" \
              --trigger-http \
              --service-account="leader-cron@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
              --timeout="$timeout" --memory="$memory" \
              --quiet
            echo "Redeployed $name"
          }
          redeploy leader-outreach    runOutreach 900s 512Mi
          redeploy leader-import-lead importLead  540s 512Mi
          redeploy leader-bulk-import bulkImport  540s 256Mi
          redeploy leader-westringia  westringia  300s 512Mi
